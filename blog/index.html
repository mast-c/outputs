<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="林墨的创作、技术、阅读与生活观察。" />
    <title>林墨 | 创作与思考</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header" id="top"></header>

    <main id="main">
      <section class="hero page-shell" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">LIN MO / NOTES ON MAKING</p>
          <h1 id="hero-title">把日常的困惑，<br />慢慢写成答案。</h1>
          <p class="hero-intro">我是空白，一名独立写作者与产品设计师。在这里记录创作过程、技术实践、阅读片段，以及值得反复琢磨的生活。</p>
          <div class="hero-actions">
            <a class="button button-primary" href="#writing">开始阅读 <i data-lucide="arrow-down-right"></i></a>
            <a class="text-link" href="#about">认识我 <i data-lucide="arrow-up-right"></i></a>
          </div>
        </div>
        <figure class="hero-image">
          <img src="assets/hero-still-life.png" alt="书桌上的书籍、笔记与暖色阅读灯" />
          <figcaption>September, 2026</figcaption>
        </figure>
      </section>

      <section class="featured page-shell" aria-labelledby="featured-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">01 / FEATURED</p>
            <h2 id="featured-title">此刻值得停留的文章</h2>
          </div>
          <a class="text-link desktop-only" href="#writing">所有文章 <i data-lucide="arrow-right"></i></a>
        </div>
        <article class="featured-story" id="featured-story"></article>
      </section>

      <section class="writing page-shell" id="writing" aria-labelledby="writing-title">
        <div class="section-heading writing-heading">
          <div>
            <p class="eyebrow">02 / WRITING</p>
            <h2 id="writing-title">最近写作</h2>
          </div>
          <p class="article-count" id="article-count" aria-live="polite"></p>
        </div>
        <div class="filter-bar">
          <div class="tag-filters" aria-label="文章分类" id="tag-filters"></div>
          <label class="search-field">
            <i data-lucide="search" aria-hidden="true"></i>
            <span class="visually-hidden">搜索文章</span>
            <input id="post-search" type="search" placeholder="搜索文章" autocomplete="off" />
          </label>
        </div>
        <div class="post-list" id="post-list"></div>
        <p class="empty-state" id="empty-state" hidden>没有找到匹配的文章。试试换一个关键词或分类。</p>
      </section>

      <section class="about-band" id="about" aria-labelledby="about-title">
        <div class="page-shell about-layout">
          <p class="eyebrow">03 / ABOUT</p>
          <div>
            <h2 id="about-title">我相信好的创作，<br />从认真感受开始。</h2>
            <p>白天，我参与把复杂的问题变成清晰可用的体验。其余时间，我阅读、散步，收集那些还没有结论的念头。这是一个允许它们慢慢生长的地方。</p>
            <a class="button button-dark" href="mailto:hello@example.com">写封邮件 <i data-lucide="send"></i></a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer page-shell"></footer>
  </body>
</html>
